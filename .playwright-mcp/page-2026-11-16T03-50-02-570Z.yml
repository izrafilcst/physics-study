        - generic [ref=e3630]: 20 min · destrava os Problemas 29 e 26
      - paragraph [ref=e3631]: "Por que isso existe. Uma barra de plástico carregada tem bilhões de cargas: não dá para somar uma por uma. A saída é fatiar o objeto em pedacinhos tão pequenos que cada um vira uma carga pontual, e somar todos com uma integral. Programas de simulação de campo fazem exatamente isso, com milhões de pedaços. O arco é o caso mais amigável: no centro dele, todos os pedaços estão à mesma distância."
      - 'heading "A ideia: gente em volta de uma mesa redonda" [level=3] [ref=e3632]'
      - generic [ref=e3633]:
        - paragraph [ref=e3634]: Imagine pessoas sentadas em volta de uma mesa redonda, todas empurrando um disco de hóquei que está no centro, com a mesma força. Duas pessoas em lados opostos se anulam. Se a mesa está cheia, o disco não sai do lugar. Se só metade da mesa tem gente, os empurrões "de lado" se anulam aos pares e sobra um empurrão para o lado vazio.
        - paragraph [ref=e3635]: "No arco carregado é igual: cada pedacinho empurra (se positivo) o ponto central com a mesma intensidade, porque está à mesma distância r."
